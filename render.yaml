# Render Blueprint — Infrastructure as Code
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: radarvecinal-api
    runtime: node
    repo: https://github.com/cponce123com-create/RadarVecinal
    region: oregon
    plan: free
    branch: main
    # Monorepo root — se usa npx pnpm@9 porque corepack falla en Render (ROFS)
    # NOTA: node ./build.mjs directamente NO funciona porque pnpm usa node_modules/.pnpm/
    # Es necesario usar pnpm exec para que Node resuelva las dependencias correctamente.
    buildCommand: npx pnpm@9 install --no-frozen-lockfile && cd artifacts/api-server && npx pnpm@9 exec node build.mjs && cd ../radar-vecinal && npx pnpm@9 run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: radarvecinal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GCS_BUCKET_NAME
        value: ""
      - key: GCS_PROJECT_ID
        value: ""
      - key: SEED_KEY
        value: ""
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        value: ""

databases:
  - name: radarvecinal-db
    region: oregon
    plan: free
    databaseName: radarvecinal
    ipAllowList: []
