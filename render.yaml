# Render Blueprint — Infrastructure as Code
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: radarvecinal-api
    runtime: node
    repo: https://github.com/cponce123com-create/RadarVecinal
    region: oregon
    plan: free
    branch: main
    # Monorepo root — build via script para evitar escapes en el dashboard de Render
    buildCommand: bash render-build.sh
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: radarvecinal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Cloudinary — necesario para subir fotos (personas extraviadas, reportes).
      # Sin estas variables, la carga de imágenes devuelve 503 con aviso claro.
      # Obtén los valores en https://cloudinary.com/console
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SEED_KEY
        value: ""
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        value: ""
      - key: RENIEC_API_TOKEN
        value: ""
      # Telegram: 1 bot global, N canales (uno por distrito, en la BD).
      # Si faltan, la función queda desactivada (los reportes se crean igual).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Canal global de RESPALDO (opcional): destino si un distrito no tiene el
      # suyo configurado. En multi-distrito puede quedar vacío.
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Secreto del webhook (auto-vinculación /vincular). Debe coincidir con el
      # secret_token usado en setWebhook.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Usuario del bot (para armar el enlace de invitación en el panel).
      - key: TELEGRAM_BOT_USERNAME
        value: "radar_vecinal_bot"

databases:
  - name: radarvecinal-db
    region: oregon
    plan: free
    databaseName: radarvecinal
    ipAllowList: []
