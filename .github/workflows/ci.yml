name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base: los PR apilados (por ejemplo
  # feature/audit-cycle-002 -> feature/audit-cycle-001) también tienen que
  # pasar el CI. Antes solo se ejecutaba contra main y un ciclo apilado podía
  # llegar a revisión sin ninguna verificación.
  pull_request:

# Solo lectura: ningún job necesita escribir en el repo.
permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo ref: ahorra minutos de runner y
# evita que un push viejo "pase" después de uno nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: radarvecinal_test
  PGHOST: localhost
  PGPORT: 5432

jobs:
  install:
    name: 📦 Instalación reproducible
    runs-on: ubuntu-latest
    outputs:
      frozen-lockfile: ${{ steps.check.outputs.frozen }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      # El lockfile tiene que ser EXACTAMENTE el que se commiteó. Si el
      # workspace y el lockfile divergen (un override que se quitó, por
      # ejemplo), pnpm aborta con PNPM_LOCKFILE_CONFIG_MISMATCH y el resto
      # del pipeline no significa nada.
      - name: Verificar lockfile congelado
        id: check
        run: |
          pnpm install --frozen-lockfile
          echo "frozen=true" >> "$GITHUB_OUTPUT"

  lint-format:
    name: ⚡ Lint & Formato
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Cubre backend, frontend, librerías compartidas y scripts: el gate
      # anterior solo miraba el backend, así que el frontend podía llegar
      # a producción sin formatear.
      - name: Check formatting (Prettier)
        run: |
          pnpm exec prettier --check \
            "artifacts/api-server/src/**/*.ts" \
            "artifacts/radar-vecinal/src/**/*.{ts,tsx}" \
            "artifacts/radar-vecinal/__tests__/**/*.{ts,tsx}" \
            "lib/**/*.ts" \
            "tools/*.mjs" \
            --no-error-on-unmatched-pattern

  audit:
    name: 🛡️ Auditoría de dependencias
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # El gate BLOQUEA con vulnerabilidades altas o críticas en las
      # dependencias de PRODUCCIÓN (lo que de verdad llega al usuario).
      # El informe completo (incluidas las de herramientas de build) se
      # publica como artefacto sin romper el pipeline: son打击 por
      # herramienta local, sin superficie de ataque en producción.
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high
      - name: Informe completo de auditoría
        if: always()
        run: pnpm audit --json > audit-report.json || true
      - name: Publicar informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.json
          if-no-files-found: ignore

  typecheck:
    name: 🔍 TypeCheck (monorepo)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `pnpm run typecheck` = libs (tsc --build) + api-server + frontend.
      # Antes solo se comprobaba el backend: el frontend podía romperse sin
      # que nadie lo notara.
      - name: Typecheck
        run: pnpm run typecheck

  test-api:
    name: 🧪 Tests unitarios (API)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Sin DATABASE_URL los tests de integración se saltan: aquí solo se
      # validan los que no tocan la base de datos.
      - name: Run unit tests
        run: pnpm --filter "@workspace/api-server" run test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: artifacts/api-server/test-results/**
          if-no-files-found: ignore

  test-frontend:
    name: 🧪 Tests (Frontend)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm --filter "@workspace/radar-vecinal" run test

  test-integration:
    name: 🗄️ Tests de integración (Postgres real)
    runs-on: ubuntu-latest
    needs: [install]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radarvecinal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/radarvecinal_test
      JWT_SECRET: ci-test-secret-not-a-real-credential-min32ch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Aplicar el esquema (drizzle-kit push)
        run: pnpm --filter "@workspace/db" run push
      # La suite completa (unitarios + integración) contra Postgres real: es
      # la única forma de validar de verdad el aislamiento por distrito, las
      # sanciones y el ciclo de vida de las alertas de pánico.
      - name: Run tests
        run: pnpm --filter "@workspace/api-server" run test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: artifacts/api-server/test-results/**
          if-no-files-found: ignore

  build:
    name: 📦 Build (API + Frontend)
    runs-on: ubuntu-latest
    needs: [typecheck, test-api, test-frontend, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared libs
        # Sin `|| true`: si las librerías compartidas no compilan, el build
        # tiene que fallar, no continuar con un artefacto inconsistente.
        run: pnpm exec tsc --build
      - name: Build api-server
        run: pnpm --filter "@workspace/api-server" run build
      - name: Build frontend
        run: pnpm --filter "@workspace/radar-vecinal" run build
      - name: Upload api-server build
        uses: actions/upload-artifact@v4
        with:
          name: api-server-build
          path: artifacts/api-server/dist/
          if-no-files-found: error
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: radar-vecinal-build
          path: artifacts/radar-vecinal/dist/
          if-no-files-found: error
