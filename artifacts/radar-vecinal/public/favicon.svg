<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="452" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C7BFF"/>
      <stop offset="1" stop-color="#1740C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="399" y1="156" x2="196" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="badge"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <!-- Badge -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <g clip-path="url(#badge)" stroke-linecap="round">
    <!-- Crosshair -->
    <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="8">
      <line x1="256" y1="60" x2="256" y2="452"/>
      <line x1="60" y1="256" x2="452" y2="256"/>
    </g>

    <!-- Anillos del radar -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="12"/>
    <circle cx="256" cy="256" r="102" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="12"/>

    <!-- Barrido -->
    <path d="M256 256 L399.3 155.6 A175 175 0 0 0 196.1 91.6 Z" fill="url(#sweep)"/>
    <line x1="256" y1="256" x2="399.3" y2="155.6" stroke="#ffffff" stroke-opacity="0.95" stroke-width="11"/>

    <!-- Blip (vecino detectado) -->
    <circle cx="372" cy="224" r="30" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="372" cy="224" r="16" fill="#ffffff"/>

    <!-- Centro -->
    <circle cx="256" cy="256" r="15" fill="#ffffff"/>
  </g>
</svg>
