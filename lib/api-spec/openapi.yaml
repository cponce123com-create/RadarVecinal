openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Radar Vecinal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: reports
    description: Incident reports
  - name: alerts
    description: Panic alerts
  - name: missing
    description: Missing person alerts
  - name: stats
    description: Statistics
  - name: users
    description: User management
  - name: admin
    description: Admin operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Get all reports
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: district
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
                  total:
                    type: number
                required:
                  - reports
                  - total
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportInput"
      responses:
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                required:
                  - success
                  - id

  /reports/{id}/confirm:
    post:
      operationId: confirmReport
      tags: [reports]
      summary: Confirm a report (increment confirmedCount)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/nearby:
    get:
      operationId: getReportsNearby
      tags: [reports]
      summary: Get reports near a location using haversine distance
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius
          in: query
          required: true
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Nearby reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/NearbyReport"
                  count:
                    type: number
                  query:
                    type: object
                    properties:
                      lat:
                        type: number
                      lng:
                        type: number
                      radius:
                        type: number
                required:
                  - reports
                  - count
                  - query
        "400":
          description: Invalid query parameters

  /panic-alerts:
    get:
      operationId: getPanicAlerts
      tags: [alerts]
      summary: Get all panic alerts
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of panic alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PanicAlert"
                required:
                  - alerts
    post:
      operationId: createPanicAlert
      tags: [alerts]
      summary: Create a panic alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePanicAlertInput"
      responses:
        "201":
          description: Panic alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanicAlert"

  /panic-alerts/stream:
    get:
      operationId: streamPanicAlerts
      tags: [alerts]
      summary: SSE stream of panic alerts
      responses:
        "200":
          description: SSE stream of panic alert events
          content:
            text/event-stream:
              schema:
                type: string

  /missing-persons:
    get:
      operationId: getMissingPersons
      tags: [missing]
      summary: Get missing person alerts
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of missing person alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/MissingPerson"
                required:
                  - alerts
    post:
      operationId: createMissingPerson
      tags: [missing]
      summary: Create a missing person alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissingPersonInput"
      responses:
        "201":
          description: Missing person alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingPerson"

  /missing-persons/{id}:
    patch:
      operationId: updateMissingPerson
      tags: [missing]
      summary: Update a missing person alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMissingPersonInput"
      responses:
        "200":
          description: Alert updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingPerson"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get statistics
      responses:
        "200":
          description: Statistics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /activity:
    get:
      operationId: getActivity
      tags: [reports]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityItem"
                required:
                  - items

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: Get all users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required:
                  - users

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /notifications:
    get:
      operationId: getNotifications
      tags: [users]
      summary: Get notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  unreadCount:
                    type: number
                required:
                  - notifications
                  - unreadCount

  /ad-slots:
    get:
      operationId: getAdSlots
      tags: [admin]
      summary: Get advertisement slots
      responses:
        "200":
          description: List of ad slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  ads:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdSlot"
                required:
                  - ads
    post:
      operationId: createAdSlot
      tags: [admin]
      summary: Create an advertisement slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdSlot"
      responses:
        "201":
          description: Ad slot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSlot"

  /ad-slots/{id}:
    patch:
      operationId: updateAdSlot
      tags: [admin]
      summary: Update an advertisement slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdSlot"
      responses:
        "200":
          description: Ad slot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSlot"

  /seed:
    post:
      operationId: seedData
      tags: [admin]
      summary: Seed database with sample data
      responses:
        "200":
          description: Database seeded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedResponse"
        "500":
          description: Seeding failed

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
        '500':
          description: Failed to serve object.

  /storage/public-objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public object from PUBLIC_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Public object not found.
        '500':
          description: Failed to serve public object.

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthRegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        sector:
          type: string
        district:
          type: string
        dni:
          type: string
          nullable: true
      required:
        - name
        - email
        - password
        - sector
        - district

    AuthLoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    SeedResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        seeded:
          type: object
          properties:
            users:
              type: number
            reports:
              type: number
            alerts:
              type: number
      required:
        - success
        - message

    Report:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
            - robbery
            - fight
            - suspicious
            - water_cut
            - garbage
            - informal_commerce
            - noise
            - missing_person
            - fire
            - medical_emergency
            - prostitution
            - drug_point
            - bar_trouble
            - other
        urgency:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        status:
          type: string
          enum:
            - active
            - reviewing
            - resolved
            - archived
        isAnonymous:
          type: boolean
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        sector:
          type: string
        district:
          type: string
        imageUrl:
          type: string
          nullable: true
        authorName:
          type: string
        contactPhone:
          type: string
          nullable: true
        confirmedCount:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - description
        - category
        - urgency
        - status
        - isAnonymous
        - latitude
        - longitude
        - sector
        - district
        - authorName
        - confirmedCount
        - createdAt

    CreateReportInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        urgency:
          type: string
        isAnonymous:
          type: boolean
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        sector:
          type: string
        district:
          type: string
        imageUrl:
          type: string
          nullable: true
        authorName:
          type: string
        contactPhone:
          type: string
          nullable: true
      required:
        - title
        - description
        - category
        - urgency
        - isAnonymous
        - latitude
        - longitude
        - sector
        - authorName

    UpdateReportInput:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        description:
          type: string

    PanicAlert:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - robbery
            - medical
            - fight
            - fire
            - missing_person
            - other
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        authorName:
          type: string
        sector:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - latitude
        - longitude
        - authorName
        - sector
        - isActive
        - createdAt

    CreatePanicAlertInput:
      type: object
      properties:
        type:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        authorName:
          type: string
        sector:
          type: string
      required:
        - type
        - latitude
        - longitude
        - authorName
        - sector

    MissingPerson:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: number
          nullable: true
        clothing:
          type: string
        photoUrl:
          type: string
          nullable: true
        lastSeenLatitude:
          type: number
        lastSeenLongitude:
          type: number
        lastSeenAddress:
          type: string
        lastSeenAt:
          type: string
        contactInfo:
          type: string
        status:
          type: string
          enum:
            - active
            - found
            - archived
        reportedBy:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - clothing
        - lastSeenLatitude
        - lastSeenLongitude
        - lastSeenAddress
        - lastSeenAt
        - contactInfo
        - status
        - reportedBy
        - createdAt

    CreateMissingPersonInput:
      type: object
      properties:
        name:
          type: string
        age:
          type: number
          nullable: true
        clothing:
          type: string
        photoUrl:
          type: string
          nullable: true
        lastSeenLatitude:
          type: number
        lastSeenLongitude:
          type: number
        lastSeenAddress:
          type: string
        lastSeenAt:
          type: string
        contactInfo:
          type: string
        reportedBy:
          type: string
      required:
        - name
        - clothing
        - lastSeenLatitude
        - lastSeenLongitude
        - lastSeenAddress
        - lastSeenAt
        - contactInfo
        - reportedBy

    UpdateMissingPersonInput:
      type: object
      properties:
        status:
          type: string
        clothing:
          type: string
        photoUrl:
          type: string
          nullable: true

    Stats:
      type: object
      properties:
        totalReports:
          type: number
        activeAlerts:
          type: number
        todayIncidents:
          type: number
        resolvedToday:
          type: number
        criticalZone:
          type: string
        reportsByCategory:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: number
            required:
              - category
              - count
        reportsByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: number
            required:
              - status
              - count
        weeklyTrend:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
              count:
                type: number
            required:
              - day
              - count
        topSectors:
          type: array
          items:
            type: object
            properties:
              sector:
                type: string
              count:
                type: number
            required:
              - sector
              - count
      required:
        - totalReports
        - activeAlerts
        - todayIncidents
        - resolvedToday
        - criticalZone
        - reportsByCategory
        - reportsByStatus
        - weeklyTrend
        - topSectors

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - report
            - panic
            - missing
            - resolved
        title:
          type: string
        description:
          type: string
        category:
          type: string
          nullable: true
        urgency:
          type: string
          nullable: true
        sector:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
      required:
        - id
        - type
        - title
        - description
        - sector
        - authorName
        - createdAt

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - admin
            - moderator
            - user
        sector:
          type: string
        district:
          type: string
        isActive:
          type: boolean
        reportsCount:
          type: number
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - sector
        - district
        - isActive
        - reportsCount
        - createdAt

    AdSlot:
      type: object
      properties:
        id:
          type: string
        businessName:
          type: string
        tagline:
          type: string
        imageUrl:
          type: string
          nullable: true
        targetUrl:
          type: string
        isActive:
          type: boolean
        sector:
          type: string
          nullable: true
      required:
        - id
        - businessName
        - tagline
        - targetUrl
        - isActive

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
        sector:
          type: string
        district:
          type: string
        dni:
          type: string
          nullable: true

    NearbyReport:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        urgency:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        sector:
          type: string
        distance:
          type: number
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - category
        - latitude
        - longitude
        - distance
        - status
        - createdAt

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - title
        - body
        - read
        - createdAt

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
