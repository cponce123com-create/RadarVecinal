name: 📱 Build Android APK

# Compila el APK de depuración en la nube (los runners de GitHub sí tienen el
# Android SDK y acceso a los servidores de Google). Se puede lanzar a mano desde
# la pestaña Actions, o automáticamente al crear un tag vX.Y.Z.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Compilar la web app (Vite)
        run: pnpm exec vite build
        working-directory: artifacts/radar-vecinal

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Paquetes del SDK (Capacitor 7 → android-35)
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generar la plataforma Android (Capacitor)
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      # Firebase (push): si el secreto GOOGLE_SERVICES_JSON está configurado,
      # escribe google-services.json y aplica el plugin de Google Services en el
      # proyecto Android recién generado. Sin el secreto, el APK se compila igual
      # pero sin push (best-effort).
      - name: Configurar Firebase para push (si hay secreto)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "⚠️  GOOGLE_SERVICES_JSON no configurado — APK sin notificaciones push."
            exit 0
          fi
          printf '%s' "$GS" > android/app/google-services.json
          echo "✅ google-services.json escrito."

          # classpath del plugin en el build.gradle del proyecto (idempotente).
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            perl -0pi -e "s/(classpath 'com\.android\.tools\.build:gradle[^']*')/\$1\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
          fi

          # aplicar el plugin en el build.gradle de la app (idempotente).
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          echo "✅ Plugin Google Services aplicado."

      - name: Build del APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: radar-vecinal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
