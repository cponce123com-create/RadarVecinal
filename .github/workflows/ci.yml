name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PNPM_VERSION: latest
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: radarvecinal_test
  PGHOST: localhost
  PGPORT: 5432

jobs:
  lint-format:
    name: ⚡ Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check formatting (Prettier)
        run: pnpm exec prettier --check "artifacts/api-server/src/**/*.ts" "lib/**/*.ts" --no-error-on-unmatched-pattern

  typecheck-api:
    name: 🔍 TypeCheck (API Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared libs (db, api-zod)
        run: pnpm --filter "@workspace/db" --filter "@workspace/api-zod" run build 2>/dev/null || true
      - name: TypeCheck api-server
        run: pnpm --filter "@workspace/api-server" run typecheck

  test-api:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm --filter "@workspace/api-server" run test -- --run
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: artifacts/api-server/test-results/**/*
          if-no-files-found: ignore

  test-integration:
    name: 🗄️ Integration Tests (w/ Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radarvecinal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/radarvecinal_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared libs
        run: pnpm --filter "@workspace/db" --filter "@workspace/api-zod" run build 2>/dev/null || true
      - name: Push DB schema (fresh Postgres)
        run: pnpm --filter "@workspace/db" run push
      - name: Run tests (incl. integration)
        run: pnpm --filter "@workspace/api-server" run test -- --run
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: artifacts/api-server/test-results/**/*
          if-no-files-found: ignore

  build-api:
    name: 📦 Build (API Server)
    runs-on: ubuntu-latest
    needs: [typecheck-api, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared libs
        run: pnpm --filter "@workspace/db" --filter "@workspace/api-zod" run build 2>/dev/null || true
      - name: Build api-server
        run: pnpm --filter "@workspace/api-server" run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-server-build
          path: artifacts/api-server/dist/
          if-no-files-found: error

  build-frontend:
    name: 🌐 Build Frontend
    runs-on: ubuntu-latest
    needs: [typecheck-api, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared libs (db, api-zod)
        run: pnpm --filter "@workspace/db" --filter "@workspace/api-zod" run build 2>/dev/null || true
      - name: Build radar-vecinal frontend
        run: pnpm --filter "@workspace/radar-vecinal" run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-vecinal-build
          path: artifacts/radar-vecinal/dist/
          if-no-files-found: error
