packages:
  - artifacts/*
  - lib/*

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: 12.35.1
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.0
  zod: ^3.25.76

minimumReleaseAge: 0

# ── Solo las dependencias opcionales de la plataforma actual ───────────────
# Antes se resolvía con ~80 overrides del tipo "rollup>@rollup/rollup-win32-
# x64-msvc: '-'", que excluían a mano los binarios nativos de otras
# plataformas. Eso adelgazaba la instalación, pero rompía Windows: rollup
# exige su binario nativo y sin él vitest/vite no arrancan ("Cannot find
# module @rollup/rollup-win32-x64-msvc"). `supportedArchitectures` consigue
# lo mismo (instalar solo lo de la plataforma que se está usando) sin
# romper ningún sistema operativo, y sin mantener una lista brittle.
supportedArchitectures:
  os:
    - current
  cpu:
    - current

overrides:
  # Alias heredado de Expo: no se usa, pero se fija para no arrastrar el
  # esm-loader (que exige un build nativo).
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  # Versión única de esbuild para todo el monorepo (build del api-server y
  # vite comparten el mismo binario nativo).
  esbuild: 0.27.3

  # ── Parches de seguridad (audit 2026-10-21) ──────────────────────────────
  # Todos son actualizaciones de PATCH dentro del mismo major: no cambian la
  # API pública, así que es seguro fijarlos aquí.
  #
  # proxy-addr (CRÍTICA): versión < 2.0.8 confunde las direcciones IPv4
  # mapeadas en IPv6 y permite suplantar la IP real. Como el rate limit de
  # login se calcula con `ipKeyGenerator(req.ip)`, un atacante podía evadir
  # el bloqueo por intentos y forzar contraseñas a la fuerza.
  proxy-addr: ^2.0.8
  # js-yaml: >= 4.3.0 (DoS de CPU con claves de merge y resolución !!omap).
  js-yaml: ^4.3.2
  # fast-uri: >= 3.1.4 (confusión de host y SSRF en la serialización de URL).
  fast-uri: ^3.1.7
  # ip-address: >= 10.3.1 (decodificación de octetos con cero inicial).
  ip-address: ^10.3.1
  # postcss: >= 8.5.18 (path traversal al cargar source maps anteriores).
  postcss: ^8.5.18
  # fast-xml-parser: >= 5.10.1 (DoS por DOCTYPE repetidos).
  fast-xml-parser: ^5.10.1
  # browserslist: >= 4.28.7 (fuga de memoria sin evicción de caché).
  browserslist: ^4.28.7
  # source-map-js: >= 1.2.2 (DoS por manipulación del event loop).
  source-map-js: ^1.2.2
  # vite: >= 7.3.7.
  vite: ^7.3.7
  # @grpc/grpc-js: >= 1.14.5 (getAuthContext con contextos no autorizados).
  '@grpc/grpc-js': ^1.14.5
  # @fastify/busboy: >= 3.2.1 (DoS al procesar multipart).
  '@fastify/busboy': ^3.2.1
  # brace-expansion: hay dos majors en el árbol; cada uno necesita su parche
  # (2.x >= 2.1.7, 5.x >= 5.0.12). El selector por rango evita bajar de major.
  'brace-expansion@>=2.0.0 <3.0.0': ^2.1.7
  'brace-expansion@>=3.0.0': ^5.0.12
  # nanoid: solo la rama 3.x está afectada (< 3.3.18); la 5.x del árbol es OK.
  'nanoid@>=3.0.0 <4.0.0': ^3.3.18

  # ── Parches de herramientas de build (no llegan a producción) ───────────
  # Mismo criterio: parche dentro del major cuando se puede, selector por
  # rango cuando el árbol tiene varias ramas del mismo paquete.
  undici: ^7.29.1
  tar: ^7.5.21
  markdown-it: ^14.3.3
  '@xmldom/xmldom': ^0.9.12

# Aprobar scripts de build de dependencias. En CI, pnpm 11 falla (exit 1) si
# hay scripts de build sin aprobar; esbuild y otros los necesitan de verdad.
allowBuilds:
  '@firebase/util': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
